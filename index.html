<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduControl - Gestión Académica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      #error-trap {
        display: none;
        padding: 20px;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        margin: 20px;
        border-radius: 8px;
        font-family: monospace;
        z-index: 9999;
        position: relative;
      }
      /* Simple loading spinner styles */
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #475569;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #4f46e5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
      // 1. Polyfill process immediately to prevent ReferenceError
      window.process = window.process || { env: { API_KEY: '' } };
      
      // 2. Global Error Handler to catch Script Errors or React crashes
      window.addEventListener('error', function(e) {
        const trap = document.getElementById('error-trap');
        if (trap) {
            trap.style.display = 'block';
            trap.innerHTML = '<strong>Error Crítico del Sistema:</strong><br/>' + e.message;
            // Hide the loader if error occurs
            const loader = document.getElementById('loader');
            if(loader) loader.style.display = 'none';
        }
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0?deps=react@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai"
  }
}
</script>
</head>
  <body>
    <div id="error-trap"></div>
    <div id="root">
        <div id="loader" class="initial-loader">
            <div class="spinner"></div>
            <p>Iniciando EduControl...</p>
        </div>
    </div>
    <!-- CRITICAL FIX: Load the application entry point -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
