<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduControl - Gestión Académica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      #error-trap {
        display: none;
        padding: 20px;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        margin: 20px;
        border-radius: 8px;
        font-family: monospace;
        z-index: 9999;
        position: relative;
      }
    </style>
    <script>
      // 1. Polyfill process immediately to prevent ReferenceError
      window.process = window.process || { env: { API_KEY: '' } };
      
      // 2. Global Error Handler to catch Script Errors or React crashes
      window.addEventListener('error', function(e) {
        const trap = document.getElementById('error-trap');
        if (trap) {
            trap.style.display = 'block';
            trap.innerHTML = '<strong>Error Crítico del Sistema:</strong><br/>' + e.message;
            console.error(e);
        }
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0?deps=react@18.2.0",
    "react": "https://esm.sh/react@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="error-trap"></div>
    <div id="root"></div>
  </body>
</html>
